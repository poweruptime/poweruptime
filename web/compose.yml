name: poweruptime-local-backend-dev

services:
  poweruptime-web:
    container_name: poweruptime-web
    restart: unless-stopped
    depends_on:
      poweruptime-backend:
        condition: service_healthy
    build:
      context: web
    ports:
      - '4200:4200'
    networks:
      - poweruptime-local-backend-dev-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', '--tries=1', 'http://127.0.0.1:4200']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  poweruptime-local-backend-dev-network:

volumes:
  db:
  rabbit:
  backend:
