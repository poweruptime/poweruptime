<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>poweruptime</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="og:type" content="website" />
    <meta name="og:site_name" content="poweruptime" />

    <link rel="icon" type="image/png" href="/assets/favis/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favis/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favis/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favis/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="poweruptime" />
    <link rel="manifest" href="/assets/favis/site.webmanifest" />
  </head>
  <body id="body">
    <script>
      (function () {
        'use strict';
        try {
          const t = localStorage.getItem('pu_theme') || 'system',
            e =
              t === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : t === 'light' || t === 'dark'
                  ? t
                  : 'light',
            n = document.documentElement;
          if (n) {
            (n.classList.remove('light', 'dark'),
              e === 'dark'
                ? (n.classList.add('dark'), n.setAttribute('data-theme', 'dark'))
                : (n.classList.remove('dark'), n.removeAttribute('data-theme')),
              (n.style.colorScheme = e));
          }
        } catch (e) {
          try {
            const n = document.documentElement;
            n &&
              (n.classList.remove('light', 'dark'),
              n.removeAttribute('data-theme'),
              (n.style.colorScheme = 'light'));
          } catch (e) {}
        }
      })();
    </script>

    <app-root></app-root>
  </body>
</html>
