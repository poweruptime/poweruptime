<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="2; url=https://github.com/poweruptime/poweruptime" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #222222;
        --link-color: #0366d6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --text-color: #c9d1d9;
          --link-color: #58a6ff;
        }
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .spinner {
        margin-top: 1rem;
        width: 32px;
        height: 32px;
        border: 3px solid var(--link-color);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      // Fallback in case meta refresh is blocked
      setTimeout(() => {
        window.location.href = 'https://github.com/poweruptime/poweruptime';
      }, 500);
    </script>
  </head>
  <body>
    <h1>Redirecting...</h1>
    <p>
      You will be redirected to
      <a href="https://github.com/poweruptime/poweruptime">
        https://github.com/poweruptime/poweruptime
      </a>
      in a moment.
    </p>
    <div class="spinner"></div>
  </body>
</html>
