complexity:
  LongParameterList:
    allowedFunctionParameters: 10
    allowedConstructorParameters: 10
    ignoreAnnotatedParameter: [Value]
  CyclomaticComplexMethod:
    allowedComplexity: 30
    ignoreSimpleWhenEntries: true
  LongMethod:
    excludes:
      - '**/test/**'
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
  ComplexCondition:
    active: true
    allowedConditions: 8

potential-bugs:
  UnsafeCallOnNullableType:
    active: false

naming:
  NoNameShadowing:
    active: false

style:
  DestructuringDeclarationWithTooManyEntries:
    maxDestructuringEntries: 6
  WildcardImport:
    active: false
  ThrowsCount:
    max: 10
  ReturnCount:
    max: 10
    excludeGuardClauses: true
  MagicNumber:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

# Formatting contains some overlapping rules with the standard rule set -> deactivate them, so we do not get duplicate errors
ktlint:
  NoWildcardImports: # style>WildcardImport
    active: false
  Filename: # naming>MatchingDeclarationName
    active: false
  ModifierOrdering: # style>ModifierOrder
    active: false
  TrailingCommaOnCallSite:
    active: true

performance:
  SpreadOperator:
    active: false
