name: dev ci

on:
  pull_request:
  push:
    branches:
      - main

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint Check
    runs-on: ubuntu-latest
    steps:
      # Needed to get the commitlint config
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run commitlint
        uses: dafnik/commitlint@v1

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Style check
        run: pnpm format:check

  web-lint:
    name: Web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Lint check
        run: pnpm web:lint

      - name: Validate translations
        working-directory: web
        run: pnpm exec transloco-validator src/assets/i18n/*.json

  detekt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Review Dog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run detekt
        run: ./gradlew detekt

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Required for gradle license report
      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Execute tests
        run: ./gradlew test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      # Picked up by every `docker compose` call below
      COMPOSE_FILE: compose-dev.yml:backend/compose.yml:web/compose.yml
      # Skip uploading build summaries/records of docker/build-push-action
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v7

      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      # Slow, independent setup work runs in the background while the
      # backend and web are built. It is awaited before the stack starts.
      - name: Start dependency services (background)
        run: .github/scripts/background.sh start services docker compose -f compose-dev.yml up -d

      - name: Extract Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies."@playwright/test"' web/package.json)" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium-firefox

      # Only install the browsers used in playwright.config.ts, everything
      # else (e.g. WebKit) pulls in a lot of additional system packages.
      #
      # man-db is removed to avoid long delays on the
      # "Processing triggers for man-db" step during installation
      # - https://github.com/actions/runner/issues/4030
      # - https://github.com/microsoft/playwright/issues/14434
      - name: Install Playwright browsers (background)
        run: |
          .github/scripts/background.sh start playwright bash -c '
            sudo apt-get --yes remove --purge man-db &&
            pnpm -C web exec playwright install --with-deps --only-shell chromium firefox
          '

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build web
        run: pnpm web:build:docker

      # Only the jar is needed, tests and detekt run in their own jobs
      - name: Build backend
        run: ./gradlew backend:bootJar -Pversion=local -Dspring.profiles.active=container --scan --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Tags match the image names docker compose would use, so the stack can
      # be started without rebuilding. Only main writes the layer cache, PRs
      # read from it.
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: poweruptime-local-dev-poweruptime-backend
          cache-from: type=gha,scope=e2e-backend
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=e2e-backend' || '' }}

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          load: true
          tags: poweruptime-local-dev-poweruptime-web
          cache-from: type=gha,scope=e2e-web
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=e2e-web' || '' }}

      - name: Wait for dependency services
        run: .github/scripts/background.sh wait services

      - name: Wait for Playwright browsers
        run: .github/scripts/background.sh wait playwright

      - name: Start stack and wait until healthy (max 5 minutes)
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Run Playwright tests
        run: pnpm web:e2e

      - name: Show stack state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps

  # Single required status check that summarizes all jobs above
  ci-ok:
    name: ci-ok
    if: always()
    needs: [commitlint, prettier, web-lint, detekt, backend-test, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one job did not succeed"
              exit 1
            fi
          done
