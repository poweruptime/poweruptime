name: dev ci (infra)

on:
  pull_request:
    paths:
      - '.github/**'
      - 'web/**'
      - 'backend/**'
      - 'emails/**'
      - 'gradle/**'
      - '.gitignore'
      - '.npmrc'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'settings.gradle.kts'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'web/**'
      - 'backend/**'
      - 'emails/**'
      - 'gradle/**'
      - '.gitignore'
      - '.npmrc'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'settings.gradle.kts'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dafnik/setup-node-pnpm@v4
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: corretto
          cache: gradle

      - name: Build backend
        run: ./gradlew backend:build -x test -Pversion=local -Dspring.profiles.active=container --scan --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose stack
        run: docker compose -f ./compose-dev.yml -f ./backend/compose.yml up -d

      - name: Wait for services to be healthy (max 5 minutes)
        run: |
          echo "⏳ Waiting for stack to become healthy..."
          timeout=300
          interval=5
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            unhealthy=$(docker ps --format '{{.Names}} {{.Status}}' | grep -E 'unhealthy|starting' || true)

            if [ -z "$unhealthy" ]; then
              echo "✅ All services are healthy!"
              exit 0
            fi

            echo "Still waiting on services:"
            echo "$unhealthy"

            sleep $interval
            elapsed=$((elapsed + interval))
          done

          echo "❌ Timeout reached: some services did not become healthy in time."
          docker ps
          exit 1

      - name: Run Playwright tests
        run: pnpm web:e2e

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
