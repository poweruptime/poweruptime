on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write # Shouldn't be needed but is needed: https://github.com/googleapis/release-please-action/issues/1105

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
