name: dev ci (backend)

on:
  pull_request:
    paths:
      - '.github/**'
      - 'backend/**'
      - 'emails/**'
      - 'gradle/**'
      - '.gitignore'
      - '.npmrc'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'settings.gradle.kts'
  push:
    branches:
      - main
    paths:
      - '.github/**'
      - 'backend/**'
      - 'emails/**'
      - 'gradle/**'
      - '.gitignore'
      - '.npmrc'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'settings.gradle.kts'

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Required for gradle license report
      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: corretto
          cache: gradle

      - name: Execute tests
        run: ./gradlew test
