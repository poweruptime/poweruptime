name: Build, test jar and create docker image

on:
  push:
    tags:
      - '*.*.*-beta-*'
      - '*.*.*'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dafnik/setup-node-pnpm@v3
        with:
          install-ignore-scripts: true

      - name: Set package version using tag name
        run: |
          TAG="${{ github.ref_name }}"
          echo "Setting package version to ${TAG}"

          # Update the version property in web/package.json using jq.
          jq --arg newVersion "${TAG}" '.version = $newVersion' web/package.json > web/package.json.tmp && \
            mv web/package.json.tmp web/package.json

          # Optional: Show the updated version for confirmation.
          grep '"version"' web/package.json

      - name: Build
        run: pnpm web:build:prod

      - name: Archive web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./web/dist/poweruptime-web
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Build
        run: ./gradlew backend:build -x test -Pversion=${{ github.ref_name }} -Dspring.profiles.active=container --scan --no-daemon

      - name: Archive backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: ./backend/build/libs/backend.jar
          retention-days: 1

  build-publish-docker:
    strategy:
      matrix:
        containers: [web, backend]
    needs: [build-backend, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend files
        if: contains(matrix.containers, 'backend')
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.containers }}
          path: ./backend/build/libs

      - name: Download web files
        if: contains(matrix.containers, 'web')
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.containers }}
          path: ./web/dist/poweruptime-web

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        # 3.4.0-beta-12345 -> 3.4.0-beta
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION%-*}" >> "$GITHUB_OUTPUT"

      - name: Build and push lava Docker image
        if: contains(github.ref_name, 'beta')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.containers }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0-beta-12345678, 3.4.0-beta, latest-beta
          tags: |
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ github.ref_name }}
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ steps.version.outputs.version }}
            ghcr.io/poweruptime/${{ matrix.containers }}:latest-beta

      - name: Build and push prod Docker image
        if: "!contains(github.ref_name, 'beta')"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.containers }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0, latest
          tags: |
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ github.ref_name }}
            ghcr.io/poweruptime/${{ matrix.containers }}:latest
