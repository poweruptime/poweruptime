name: Build, test jar and create docker image for backend service

on:
  push:
    tags:
      - '*.*.*-lava-*'
      - '*.*.*'

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew backend:build -x test -Pversion=${{ github.ref_name }} -Dspring.profiles.active=container --scan --no-daemon

      - name: Archive jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./backend/build/libs/
          retention-days: 1

  build-publish-docker:
    needs: build-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download a single jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: ./backend/build/libs/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        # 3.4.0-lava-12345 -> 3.4.0-lava
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION%-*}" >> "$GITHUB_OUTPUT"

      - name: Build and push lava Docker image
        if: contains(github.ref_name, 'lava')
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0-lava-12345678, 3.4.0-lava, latest-lava
          tags: |
            ghcr.io/poweruptime/backend:${{ github.ref_name }}
            ghcr.io/poweruptime/backend:${{ steps.version.outputs.version }}
            ghcr.io/poweruptime/backend:latest-lava

      - name: Build and push prod Docker image
        if: "!contains(github.ref_name, 'lava')"
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0, latest
          tags: |
            ghcr.io/poweruptime/backend:${{ github.ref_name }}
            ghcr.io/poweruptime/backend:latest
