name: Build and release docker images

on:
  push:
    tags:
      - '*.*.*-beta-*'
      - '*.*.*'

# We must only run one release workflow at a time to prevent corrupting
# our release artifacts.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Set package version using tag name
        run: |
          TAG="${{ github.ref_name }}"
          echo "Setting package version to ${TAG}"

          # Update the version property in web/package.json using jq.
          jq --arg newVersion "${TAG}" '.version = $newVersion' web/package.json > web/package.json.tmp && \
            mv web/package.json.tmp web/package.json

          # Optional: Show the updated version for confirmation.
          grep '"version"' web/package.json

      - name: Build
        run: pnpm web:build:docker

      - name: Archive web artifacts
        uses: actions/upload-artifact@v6
        with:
          name: web
          path: ./web/dist/poweruptime-web
          retention-days: 1

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Required for gradle license report
      - uses: dafnik/setup-node-pnpm@v5
        with:
          install-ignore-scripts: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: corretto
          cache: gradle

      - name: Build
        run: ./gradlew backend:build -x test -Pversion=${{ github.ref_name }} -Dspring.profiles.active=container --scan --no-daemon

      - name: Archive backend artifacts
        uses: actions/upload-artifact@v6
        with:
          name: backend
          path: ./backend/build/libs/backend.jar
          retention-days: 1

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          args: build --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reorganize artifacts
        run: |
          cd ./cli
          chmod +x ./reorganize-dist.sh
          ./reorganize-dist.sh ${{ github.ref_name }}
          cd -

      - name: Archive CLI artifacts
        uses: actions/upload-artifact@v6
        with:
          name: cli-artifacts
          path: ./cli/dist/binaries
          retention-days: 1

  build-publish-docker:
    strategy:
      matrix:
        containers: [web, backend]
    needs: [build-backend, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download backend files
        if: contains(matrix.containers, 'backend')
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.containers }}
          path: ./backend/build/libs

      - name: Download web files
        if: contains(matrix.containers, 'web')
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.containers }}
          path: ./web/dist/poweruptime-web

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        # 3.4.0-beta-12345 -> 3.4.0-beta
        run: |
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION%-*}" >> "$GITHUB_OUTPUT"

      - name: Build and push beta Docker image
        if: contains(github.ref_name, 'beta')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.containers }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0-beta-12345678, 3.4.0-beta, latest-beta
          tags: |
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ github.ref_name }}
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ steps.version.outputs.version }}
            ghcr.io/poweruptime/${{ matrix.containers }}:latest-beta
            dafnik/poweruptime-${{ matrix.containers }}:${{ github.ref_name }}
            dafnik/poweruptime-${{ matrix.containers }}:${{ steps.version.outputs.version }}
            dafnik/poweruptime-${{ matrix.containers }}:latest-beta

      - name: Build and push prod Docker image
        if: "!contains(github.ref_name, 'beta')"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.containers }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            version=${{ github.ref_name }}
          # tags: 3.4.0, latest
          tags: |
            ghcr.io/poweruptime/${{ matrix.containers }}:${{ github.ref_name }}
            ghcr.io/poweruptime/${{ matrix.containers }}:latest
            dafnik/poweruptime-${{ matrix.containers }}:${{ github.ref_name }}
            dafnik/poweruptime-${{ matrix.containers }}:latest

  mirror-infra:
    runs-on: ubuntu-latest
    needs: [build-publish-docker]
    container: pandoc/latex
    env:
      TARGET_BRANCH: ${{ contains(github.ref_name, 'beta') && 'beta' || 'main' }}
    steps:
      - uses: actions/checkout@v6

      - name: Pushes to docker-compose repository
        id: push_directory
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.INFRA_MIRROR_DEPLOY_TOKEN }}
        with:
          source-directory: ./infrastructure
          destination-github-username: 'poweruptime'
          destination-repository-name: 'docker-compose'
          user-email: github-actions[bot]@users.noreply.github.com
          commit-message: See ORIGIN_COMMIT from $GITHUB_REF
          target-branch: ${{ env.TARGET_BRANCH }}

      - name: Test get variable exported by push-to-another-repository
        run: echo "$DESTINATION_CLONED_DIRECTORY"

  tag-infra-mirror:
    runs-on: ubuntu-latest
    needs: [mirror-infra]
    env:
      TARGET_BRANCH: ${{ contains(github.ref_name, 'beta') && 'beta' || 'main' }}
    steps:
      - name: Check out docker-compose repository
        uses: actions/checkout@v6
        with:
          repository: poweruptime/docker-compose
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.INFRA_MIRROR_TAG_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Tag ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.INFRA_MIRROR_TAG_TOKEN }}
        run: |
          git tag ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}

  release-github:
    runs-on: ubuntu-latest
    needs: [mirror-infra, build-cli]
    env:
      CHANGELOG_FILE: ${{ contains(github.ref_name, 'beta') && './changelogs/CHANGELOG-beta.md' || './changelogs/CHANGELOG.md' }}
      IS_PRERELEASE: ${{ contains(github.ref_name, 'beta') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CLI artifacts
        uses: actions/download-artifact@v7
        with:
          name: cli-artifacts
          path: ./cli-artifacts

      - name: Get only latest changelog
        run: |
          chmod +x ./.github/extractLatestChangelog.sh
          ./.github/extractLatestChangelog.sh ${{ env.CHANGELOG_FILE }}
          cat RELEASE_CHANGELOG.md

      - name: Create release ${{ github.ref_name }}
        uses: softprops/action-gh-release@v2.5.0
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          body_path: ./RELEASE_CHANGELOG.md
          files: ./cli-artifacts/*
