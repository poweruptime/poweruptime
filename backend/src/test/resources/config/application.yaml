server:
  port: 123456
  servlet:
    context-path: /api

  tomcat:
    threads:
      max: 4

spring:
  application:
    name: poweruptime-backend

  main:
    allow-bean-definition-overriding: true
    banner-mode: off

  datasource:
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  liquibase:
    enabled: true
    change-log: classpath:db/db.changelog-test.yaml
    drop-first: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        default-requeue-rejected: 'false'

  mail:
    host: 127.0.0.1
    port: 3025 # default protocol port + 3000 as offset
    username: poweruptime
    password: poweruptime

  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration

springdoc:
  api-docs:
    enabled: true
    path: /swagger/docs-json
  swagger-ui:
    path: /swagger/docs
    operationsSorter: alpha
    tagsSorter: alpha
  packagesToScan: org.poweruptime.backend

logging:
  level:
    org.poweruptime: DEBUG
    Exposed: DEBUG
#    org.springframework.security: DEBUG
#    org.springframework.web: DEBUG
#    org.hibernate: ERROR

management:
  endpoints:
    web:
      exposure:
        include: health, liquibase, metrics, scheduledtasks
  health:
    mail:
      enabled: false

poweruptime:
  swagger: true
  host: localhost:4200
  apprise:
    url: http://localhost:8000
  mail:
    enabled: false
    security: NONE_STARTTLS
    ignore-tls-errors: true
  notification-temp:
    enabled: true
  monitor-autostart:
    enabled: false
  storage:
    directory: storage
  keys:
    directory: keys/some
    access-token:
      private: user-access-token-private.key
      public: user-access-token-public.key
    refresh-token:
      private: user-refresh-token-private.key
      public: user-refresh-token-public.key
  rate-limit:
    enabled: false
    duration-in-seconds: 120
    tries: 40
  push:
    enabled: false
  database:
    ddl-auto: validate
