databaseChangeLog:
  - changeSet:
      id: 1
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/01-init.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 2
      author: Dafnik
      changes:
        - addUniqueConstraint:
            tableName: tag
            columnNames: team_id, name
            constraintName: tag_team_id_name_key
  - changeSet:
      id: 3
      author: Dafnik
      changes:
        - addUniqueConstraint:
            tableName: notification
            columnNames: check_result_id
            constraintName: notification_check_result_id_key
  - changeSet:
      id: 4
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/04-indexes.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
