databaseChangeLog:
  - changeSet:
      id: 1
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/01-init.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 2
      author: Dafnik
      changes:
        - addUniqueConstraint:
            tableName: tag
            columnNames: team_id, name
            constraintName: tag_team_id_name_key
  - changeSet:
      id: 3
      author: Dafnik
      changes:
        - addUniqueConstraint:
            tableName: notification
            columnNames: check_result_id
            constraintName: notification_check_result_id_key
  - changeSet:
      id: 4
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/04-indexes.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 5
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/05-personal-team.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 6
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/06-exposed.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 7
      author: Dafnik
      changes:
        - dropIndex:
            indexName: check_result_monitor_id
            tableName: check_result
        - dropIndex:
            indexName: check_result_monitor_id_id
            tableName: check_result
        - createIndex:
            indexName: check_result_monitor_status
            tableName: check_result
            unique: false
            columns:
              - column:
                  name: monitor_id
              - column:
                  name: status
              - column:
                  name: previous_status
              - column:
                  name: id
  - changeSet:
      id: 8
      author: Dafnik
      changes:
        - sqlFile:
            dbms: postgresql
            encoding: utf8
            path: changelog/scripts/08-notification.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true
  - changeSet:
      id: 9
      author: Dafnik
      changes:
        - createIndex:
            tableName: status_page
            indexName: status_page_image_id
            columns:
              - column:
                  name: image_id
        - addColumn:
            tableName: team
            columns:
              - column:
                  name: image_id
                  type: bigint
                  constraints:
                    references: file(id)
                    foreignKeyName: fk_team_image_id__id
                    onUpdate: RESTRICT
                    onDelete: RESTRICT
        - createIndex:
            tableName: team
            indexName: team_image_id
            columns:
              - column:
                  name: image_id
        - addColumn:
            tableName: user
            columns:
              - column:
                  name: image_id
                  type: bigint
                  constraints:
                    references: file(id)
                    foreignKeyName: fk_user_image_id__id
                    onUpdate: RESTRICT
                    onDelete: RESTRICT
        - createIndex:
            tableName: user
            indexName: user_image_id
            columns:
              - column:
                  name: image_id
